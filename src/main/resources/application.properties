spring.application.name=record
spring.datasource.url=jdbc:mysql://${DATABASE_URL:localhost:3306/record}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.username=${DATABASE_USERNAME:usr}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT    :1025}
spring.mail.username=${DATABASE_USERNAME:user}
spring.mail.password=${MAIL_PASSWORD:pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# 環境変数
record.cros.endpoint=${RECORD_CROS_ENDPOINT:http://localhost:3000}